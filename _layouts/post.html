---
layout: default
---

<header class="page-head">
	<div class="wrap">
		{% if page.art %}{% include art.html name=page.art %}{% endif %}
		<h1>{{ page.title }}</h1>
		{% if page.description %}<p>{{ page.description }}</p>{% endif %}
	</div>
</header>

<section>
	<div class="wrap">
		<div class="prose{% if page.wide %} prose--wide{% endif %}">
			{{ content }}
		</div>
	</div>
</section>
