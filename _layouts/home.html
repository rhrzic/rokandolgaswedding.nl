---
layout: default
---

<section class="hero">
	<div class="wrap">
		{% include art.html name="disco-ball" %}
		<h1>{{ page.landing-title }}</h1>
		<p class="hero-date">{{ site.description }}</p>
	</div>
	<div class="hero-art">
		<img src="{{ "assets/images/dessert-table.svg" | relative_url }}" alt="" />
	</div>
</section>

<section class="rsvp">
	<div class="wrap">
		<div class="prose">
			<h2>RSVP</h2>
			{{ content }}
		</div>
	</div>
</section>

<div class="wrap">
	<div class="divider">{% include art.html name="sparkle" %}</div>
</div>

<section class="tiles">
	<div class="wrap">
		{% include tiles.html %}
	</div>
</section>
