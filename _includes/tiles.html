{%- assign tiles = site.html_pages | where: "nav-menu", true | sort: "path" -%}
<div class="cards">
	{%- for tile in tiles %}
	<article class="card">
		{% include art.html name=tile.art %}
		<h3><a href="{{ tile.url | relative_url }}">{{ tile.title }}</a></h3>
		{%- if tile.description %}
		<p>{{ tile.description }}</p>
		{%- endif %}
	</article>
	{%- endfor %}
</div>
