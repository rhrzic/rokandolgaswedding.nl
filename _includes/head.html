<head>
	<meta charset="utf-8" />

	<title>{% if page.title and page.layout != "home" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
	<meta name="description" content="{{ site.description }}" />

	<link rel="icon" href="{{ "assets/images/favicon.svg" | relative_url }}" type="image/svg+xml" />

	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Karla:ital,wght@0,400;0,600;1,400&display=swap" />

	<link rel="stylesheet" href="{{ "assets/css/main.css" | relative_url }}" />
</head>
